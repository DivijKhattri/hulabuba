<!DOCTYPE html>
<html>
<head>
    <title>Amazon Search Bar</title>

    <style>
        body {
            background-color: #232f3e;
            padding: 30px;
        }

        .search-bar {
            display: flex;
            width: 600px;
            height: 40px;
        }

        select {
            width: 60px;
            border: none;
            background-color: #e6e6e6;
        }

        input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 16px;
        }

        button {
            width: 50px;
            border: none;
            background-color: #febd69;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="search-bar">

        <select>
            <option>All</option>
             <option>Electronics</option>
              <option>Fashion</option>
               <option>Books</option>
                <option>Groceries</option>
                 <option>Utilities</option>
                  <option>Sports</option>
                    <option>Hula Bu</option>
                     <option>Yaka Lula</option>
                      <option>Landi Thassi</option>
        </select>

        <input type="text" placeholder="Search Amazon.in">

        
    </div>

</body>
</html>
